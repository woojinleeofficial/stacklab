# AI presets (spec 7.2): strength knobs only; ratings come from the bot league (calibration).
# pps_milli: pieces per second x1000 (pacing between pieces)
# input_delay_frames: reaction delay before the first key of each piece
# depth / beam: search over current+hold and the visible Next window (never hidden pieces)
# mistake_pm: per-mille chance to pick a random top-5 move
# attack / downstack / safety: evaluation weights
reference = "L4"

