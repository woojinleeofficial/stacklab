name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --release
      - name: build examples
        run: cargo build --workspace --release --examples
      - name: third-party licences (up to date, no GPL)
        if: runner.os == 'Linux'
        run: python3 tools/licenses.py --check
      - name: build app (release)
        run: cargo build --release -p stacklab-app
      - name: build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "stacklab-app" | Select-Object -ExpandProperty version
          & $iscc "/DAppVersion=$ver" installer\stacklab.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: installer silent install / self-check / uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/ci-install-test.ps1
      - name: upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stacklab-windows-installer
          path: target/installer/*.exe
          if-no-files-found: error
      - name: upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: stacklab-windows-x64
          path: target/release/stacklab.exe
          if-no-files-found: error
