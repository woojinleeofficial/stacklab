[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/solver",
    "crates/bot",
    "crates/opener",
    "crates/training",
    "crates/store",
    "app",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.8"
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }

[profile.release]
debug = false
