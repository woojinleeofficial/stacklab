[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/solver",
    "crates/bot",
    "crates/opener",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
debug = false
