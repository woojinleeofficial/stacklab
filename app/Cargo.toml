[package]
name = "stacklab-app"
description = "StackLab desktop app (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stacklab"
path = "src/main.rs"

[dependencies]
stacklab-engine = { path = "../crates/engine" }
stacklab-training = { path = "../crates/training" }
stacklab-store = { path = "../crates/store" }
stacklab-opener = { path = "../crates/opener" }
eframe = { version = "0.37", features = ["glow"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
